<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:Arial}#m{width:1200px;height:1000px}.t{position:absolute;z-index:999;top:10px;left:60px;background:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 2px 8px #0004;font-size:15px;max-width:640px}
.p{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:bold;font-size:16px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 1px 4px #0008}
.lb{background:#fffd;font-size:11px;padding:2px 4px;border-radius:4px;white-space:nowrap;border:1px solid #999}</style></head><body>
<div class="t"><b>Google Maps · "eletricista" · celular · 14/11/2026</b><br>Posição do <b>Mestre dos Reparos</b> em 25 pontos de Barueri (grade 5×5, 2 km).<br><span style="color:#0a0">●</span> 1º lugar &nbsp; <span style="color:#d00">●</span> fora dos 20 primeiros &nbsp; ★ sede (Jd. Belval)<br>Etiqueta = quem está em 1º naquele ponto. Fonte: OpenSEO.</div>
<div id="m"></div><script>
fetch('grid-eletricista-2026-11-14.json').then(r=>r.json()).then(d=>{
const m=L.map('m',{zoomControl:false}).setView([-23.505,-46.872],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);
for(const [la,lo,r,top] of d.pontos){const ok=r!==null;
L.marker([la,lo],{icon:L.divIcon({className:'',html:`<div class="p" style="background:${ok?'#0a0':'#d00'}">${ok?r:'20+'}</div>`,iconSize:[38,38],iconAnchor:[19,19]})}).addTo(m);
L.marker([la,lo],{icon:L.divIcon({className:'',html:`<div class="lb">${top}</div>`,iconSize:[1,1],iconAnchor:[40,-24]})}).addTo(m);}
L.marker(d.sede,{icon:L.divIcon({className:'',html:'<div style="font-size:30px;color:#f90;text-shadow:0 0 3px #000">★</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(m);
setTimeout(()=>document.body.dataset.ok=1,3500);});
</script></body></html>
