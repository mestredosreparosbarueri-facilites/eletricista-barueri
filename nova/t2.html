<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","@id":"https://www.mestredosreparos.app.br/#faq","mainEntity":[{"@type":"Question","name":"Quais serviços a Mestre dos Reparos faz?","acceptedAnswer":{"@type":"Answer","text":"Somos uma empresa multisserviços em Barueri: elétrica residencial e predial, hidráulica, reformas de apartamento, banheiro e cozinha, pintura, forro de drywall, pisos e revestimentos, marido de aluguel, limpeza (diarista, pós-obra e pós-mudança) e contratos de manutenção e limpeza para empresas e condomínios. Um só responsável do orçamento à entrega."}},{"@type":"Question","name":"Quem é o responsável técnico?","acceptedAnswer":{"@type":"Answer","text":"Paulo, engenheiro eletricista formado pela UFRJ, com registro CREA 141129611802, técnico em Eletrotécnica e em Refrigeração pelo SENAI, certificações NR-10 e NR-10 SEP e 25 anos de experiência em execução e gestão de manutenção. Serviços elétricos seguem a NBR 5410 e, quando exigido, saem com ART."}},{"@type":"Question","name":"Vocês emitem nota fiscal e dão garantia?","acceptedAnswer":{"@type":"Answer","text":"Sim. A empresa tem CNPJ ativo (64.521.657/0001-87), emite nota fiscal em todos os serviços e entrega garantia de 90 dias na mão de obra, por escrito, conforme o Código de Defesa do Consumidor."}},{"@type":"Question","name":"Tomada esquentando é perigoso?","acceptedAnswer":{"@type":"Answer","text":"Sim. Tomada quente quase sempre é mau contato ou fio subdimensionado: o aquecimento derrete o plástico e pode causar incêndio sem o disjuntor desarmar, porque não é curto-circuito. Desligue o aparelho e chame um eletricista para trocar a tomada e revisar o circuito."}},{"@type":"Question","name":"Por que o disjuntor cai quando ligo o chuveiro?","acceptedAnswer":{"@type":"Answer","text":"As causas mais comuns são disjuntor ou fiação abaixo da potência do chuveiro, resistência com defeito ou chuveiro dividindo circuito com outros aparelhos. A solução é medir a corrente e deixar o chuveiro em circuito exclusivo, com disjuntor e cabo adequados."}},{"@type":"Question","name":"Vocês resolvem vazamento sem quebrar tudo?","acceptedAnswer":{"@type":"Answer","text":"Primeiro localizamos a origem do vazamento e só abrimos o ponto necessário. Fazemos troca de registros, reparos em tubulação, sifões, ligações de máquinas e caixa d’água, com nota fiscal e garantia."}},{"@type":"Question","name":"Fazem reforma completa?","acceptedAnswer":{"@type":"Answer","text":"Sim. Executamos na ordem técnica correta: primeiro o que fica escondido (elétrica, hidráulica, impermeabilização) e depois o acabamento (drywall, pintura, pisos). Orçamento por escrito com etapas, materiais e prazos."}},{"@type":"Question","name":"Vocês atendem empresas e condomínios?","acceptedAnswer":{"@type":"Answer","text":"Sim. Temos contratos de manutenção predial e de limpeza para empresas, condomínios e galpões em Barueri, Alphaville, Santana de Parnaíba, Jandira e Itapevi. Já atendemos unidades de empresas como Bradesco, Itaú, Coca-Cola FEMSA, Bureau Veritas, PJ Bank e Armazena Armazéns Gerais."}},{"@type":"Question","name":"Quais regiões vocês atendem?","acceptedAnswer":{"@type":"Answer","text":"Todos os bairros de Barueri, incluindo Alphaville, Tamboré e Jardim Belval (sede), além de Santana de Parnaíba, Aldeia da Serra, Jandira, Itapevi e Carapicuíba. Reformas também em Cotia e Osasco."}},{"@type":"Question","name":"Como pedir orçamento?","acceptedAnswer":{"@type":"Answer","text":"Pelo WhatsApp (11) 91839-0430: mande uma foto ou vídeo do problema e o bairro. Respondemos com a avaliação e, quando possível, o orçamento; serviços maiores têm visita técnica."}}]}</script>
